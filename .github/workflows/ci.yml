name: CI for Purchase Order App

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t sup3rab3/purchase-order-system-web:latest .

    - name: Start services with docker-compose
      run: docker compose up -d

    - name: Test app availability
      run: |
        # Wait 30 seconds for the app to start
        sleep 30
        # Check if the app responds (exit 0 if OK, fail otherwise)
        curl -f --max-time 10 http://localhost:8080 || exit 1

    - name: Stop services
      if: always()
      run: docker compose down --remove-orphans
