name: CI for Purchase Order App

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t sup3rab3/purchase-order-system-web:latest .

    - name: Start services with docker compose
      run: docker compose up -d

    - name: Wait for PostgreSQL to be ready
      run: |
        for i in {1..18}; do
          if docker compose exec -T db pg_isready -U sup3rab3 -d purchase_order_db; then
            echo "PostgreSQL is ready!"
            break
          fi
          echo "Waiting for PostgreSQL... Attempt $i/18"
          sleep 5
        done

    - name: Wait for Django web to start
      run: |
        for i in {1..18}; do
          if curl -s http://localhost:8080 > /dev/null; then
            echo "Web service is ready!"
            break
          fi
          echo "Waiting for web service... Attempt $i/18"
          sleep 5
        done

    - name: Check logs
      run: docker compose logs web

    - name: Test app availability
      run: curl -f http://localhost:8080 || exit 1

    - name: Stop services
      if: always()
      run: docker compose down
