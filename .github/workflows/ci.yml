name: CI for Purchase Order App

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t sup3rab3/purchase-order-system-web:latest .

    - name: Start services with docker-compose
      run: docker compose up -d

    - name: Wait for PostgreSQL to be ready
      run: |
        # Initial buffer and max 60 seconds total wait
        for i in {1..12}; do
          if docker compose exec db pg_isready -U sup3rab3 -d purchase_order_db; then
            echo "PostgreSQL is ready!"
            break
          fi
          echo "Waiting for PostgreSQL... Attempt $i/12"
          sleep 5
        done
        if [ $i -eq 12 ]; then
          echo "PostgreSQL failed to start within 60 seconds"
          exit 1
        fi

    - name: Check container logs
      run: |
        sleep 5  # Buffer after DB is ready
        docker compose logs web

    - name: Test app availability from container
      run: |
        docker compose exec web curl -f http://localhost:8080 || exit 1

    - name: Stop services
      if: always()
      run: docker compose down --remove-orphans
