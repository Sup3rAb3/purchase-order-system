name: CI for Purchase Order App

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger for deployment

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Fix permissions on workspace
        run: sudo chown -R $USER:$USER ${{ github.workspace }}
        continue-on-error: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services with docker compose
        run: docker compose up -d --build --force-recreate  # Rely on .env for SITE_DOMAIN

      - name: Wait for web service to be healthy
        run: |
          for i in {1..18}; do
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q web))
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              echo "Web service is healthy!"
              break
            fi
            echo "Waiting for web service... Attempt $i/18"
            sleep 5
          done
          if [ $i -eq 18 ]; then
            echo "Web service failed to become healthy within 90 seconds"
            exit 1
          fi

      - name: Check container logs
        run: docker compose logs web

      - name: Test app inside running web container
        run: docker compose exec web curl -f http://localhost:8080 || exit 1

      - name: Deploy to production
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: 192.168.0.129
          username: ubuntu-adm
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu-adm/prod/purchase-order-system
            git pull origin main
            # Ensure .env is not overwritten; it should already exist with SITE_DOMAIN=192.168.0.129:8080
            docker compose down
            docker compose up -d --build --force-recreate
            # Verify the service is up
            docker compose logs web

      - name: Stop services
        if: always()
        run: docker compose down
