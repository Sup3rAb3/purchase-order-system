name: CI/CD Pipeline to AWS & Docker Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger for deployment

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Fix permissions on workspace
        run: sudo chown -R $USER:$USER ${{ github.workspace }}
        continue-on-error: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🧪 STEP 1: TEST LOCAL CONTAINER STABILITY
      - name: Start services with docker compose
        run: docker compose up -d --build --force-recreate

      - name: Wait for web service to be healthy
        run: |
          for i in {1..18}; do
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q web))
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              echo "Web service is healthy!"
              break
            fi
            echo "Waiting for web service... Attempt $i/18"
            sleep 5
          done
          if [ $i -eq 18 ]; then
            echo "Web service failed to become healthy within 90 seconds"
            exit 1
          fi

      - name: Check container logs
        run: docker compose logs web

      - name: Test app inside running web container
        run: docker compose exec web curl -f http://localhost:8080 || exit 1

      - name: Stop testing services
        run: docker compose down

      # 🚀 STEP 2: CLOUD SHIPPING (Only runs if testing passes!)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1 # Matches your AWS console region

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Production Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: purchase-order-system
          IMAGE_TAG: latest
        run: |
          # Build production-ready images
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t ${{ secrets.DOCKERHUB_USERNAME }}/purchase-order-system:latest .
          
          # Push to AWS ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Push backup to Docker Hub
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/purchase-order-system:latest

      # 🔄 STEP 3: AUTOMATICALLY DEPLOY TO THE MANAGED SERVICE (ZERO-DOWNTIME ROLLING UPDATE)
      - name: Force ECS Service Deployment
        run: |
          CLUSTER_NAME="purchase-order-prod-cluster"
          SERVICE_NAME="svc-purchase-order-system"
          
          echo "Triggering zero-downtime rolling update on AWS ECS..."
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment