name: CI for Purchase Order App

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Start services
      run: docker compose up -d --build

    - name: Wait for Django web to start
      run: |
        for i in {1..20}; do
          if docker compose run --rm web sh -c "curl -sSf http://web:8080 > /dev/null"; then
            echo "Web service is ready!"
            break
          fi
          echo "Waiting for web service... Attempt $i/20"
          sleep 5
        done

    - name: Show web logs
      run: docker compose logs web

    - name: Test app inside web container
      run: docker compose run --rm web curl -f http://web:8080

    - name: Stop services
      if: always()
      run: docker compose down
