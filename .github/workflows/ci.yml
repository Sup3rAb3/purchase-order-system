name: CI for Purchase Order App

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t sup3rab3/purchase-order-system-web:latest .

    - name: Start services with docker-compose
      run: docker compose up -d

    - name: Wait for PostgreSQL to be ready
      run: |
        sleep 10  # Initial buffer
        while ! docker compose exec db pg_isready -U sup3rab3 -d purchase_order_db; do
          echo "Waiting for PostgreSQL..."
          sleep 5
        done

    - name: Check container logs
      run: |
        sleep 30
        docker compose logs web

    - name: Test app availability from container
      run: |
        sleep 5  # Extra buffer after logs
        docker compose exec web curl -f http://localhost:8080 || exit 1

    - name: Stop services
      if: always()
      run: docker compose down --remove-orphans
