name: CI for Purchase Order App

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger for deployment

jobs:
  build-and-test:
    runs-on: self-hosted  # Use self-hosted runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true  # Force clean checkout

      - name: Clean workspace
        run: |
          # Ensure the directory exists and is writable
          mkdir -p /home/sup3rab3/actions-runner/_work/purchase-order-system/purchase-order-system
          # Clean it only if it exists
          [ -d "/home/sup3rab3/actions-runner/_work/purchase-order-system/purchase-order-system" ] && rm -rf /home/sup3rab3/actions-runner/_work/purchase-order-system/purchase-order-system/*
          find /home/sup3rab3/actions-runner/_work/ -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          # Reset ownership and permissions without sudo
          chown -R sup3rab3:sup3rab3 /home/sup3rab3/actions-runner/_work/purchase-order-system/
          chmod -R u+w /home/sup3rab3/actions-runner/_work/purchase-order-system/

      - name: Debug directory
        working-directory: /home/sup3rab3/actions-runner/_work/purchase-order-system/purchase-order-system
        run: |
          pwd
          ls -la
          echo "Checking for docker-compose.yml: $(if [ -f docker-compose.yml ]; then echo "Found"; else echo "Not found"; fi)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services with docker compose
        working-directory: /home/sup3rab3/actions-runner/_work/purchase-order-system/purchase-order-system
        run: docker compose -f docker-compose.yml up -d --build --force-recreate

      - name: Wait for web service to be healthy
        working-directory: /home/sup3rab3/actions-runner/_work/purchase-order-system/purchase-order-system
        run: |
          for i in {1..18}; do
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q web))
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              echo "Web service is healthy!"
              break
            fi
            echo "Waiting for web service... Attempt $i/18"
            sleep 5
          done
          if [ $i -eq 18 ]; then
            echo "Web service failed to become healthy within 90 seconds"
            exit 1
          fi

      - name: Check container logs
        working-directory: /home/sup3rab3/actions-runner/_work/purchase-order-system/purchase-order-system
        run: docker compose logs web

      - name: Test app inside running web container
        working-directory: /home/sup3rab3/actions-runner/_work/purchase-order-system/purchase-order-system
        run: docker compose exec web curl -f http://localhost:8080 || exit 1

      - name: Deploy to production
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: 192.168.0.129
          username: ubuntu-adm
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu-adm/prod/purchase-order-system
            git pull origin main
            docker compose down
            docker compose up -d --build --force-recreate

      - name: Stop services
        if: always()
        run: docker compose down
