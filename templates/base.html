{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JurisPO{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa; /* Light background for better contrast */
            display: flex; /* Add flexbox to the body */
            flex-direction: column; /* Stack children vertically */
            min-height: 100vh; /* Ensure the body takes up at least the full viewport height */
            box-sizing: border-box; /* Ensure padding doesn’t mess with layout */
        }

        * {
            box-sizing: border-box; /* Apply to all elements for consistency */
        }

        #header {
            background-color: #4682b4; /* Steel blue, matching your screenshot */
            color: white;
            padding: 10px 20px;
            position: fixed; /* Make the header fixed to avoid overlap */
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 50px; /* Explicit height */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #header a {
            color: white;
            text-decoration: none;
        }

        #header a:hover {
            text-decoration: underline;
        }

        #content {
            padding-top: 60px; /* Account for the fixed header height */
            padding-bottom: 60px; /* Add padding at the bottom to account for the footer */
            margin: 0; /* Remove any default margins */
            flex: 1; /* Allow the content to grow and fill available space */
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Allow scrolling if content overflows */
        }

        .main {
            flex: 1; /* Allow the main content to grow and fill space */
            padding: 0 15px; /* Add some horizontal padding */
            min-height: calc(100vh - 120px); /* Ensure it takes up enough space (subtract header and footer heights) */
        }

        #footer {
            background-color: #f0f0f0; /* Light gray footer, as requested */
            text-align: center;
            padding: 10px;
            width: 100%; /* Ensure it spans the full width */
            position: relative; /* Ensure it’s not clipped */
            z-index: 1000; /* Ensure it’s above other elements */
        }
    </style>
</head>
<body>
    <div id="header">
        <div id="branding">
            <h1 id="site-name" style="margin: 0; font-size: 1.25rem;">
                <a href="/create">JurisPO</a>
            </h1>
        </div>
        <div id="user-links">
            {% if user.is_authenticated %}
                <p style="margin: 0;">Welcome, {{ user.email }}! <a href="{% url 'custom_logout' %}">Sign Out</a></p>
            {% else %}
                <p style="margin: 0;"><a href="{% url 'account_login' %}">Login</a> | <a href="{% url 'account_signup' %}">Sign Up</a></p>
            {% endif %}
        </div>
    </div>

    <div id="content" class="flex">
        <div class="main">
            {% block content %}
            {% endblock %}
            <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
        </div>
    </div>
    <div id="footer">
        <p>Developed by Abraham © 2026</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
