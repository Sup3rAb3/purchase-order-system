services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: purchase_order_db
      POSTGRES_USER: sup3rab3
      POSTGRES_PASSWORD: Sup3r@dmin_
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8080
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      DEBUG: 1
      DB_NAME: purchase_order_db
      DB_USER: sup3rab3
      DB_PASSWORD: Sup3r@dmin_
      DB_HOST: db
      DB_PORT: 5432

volumes:
  postgres_data:
