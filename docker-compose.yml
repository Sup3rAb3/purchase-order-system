services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: purchase_order_db
      POSTGRES_USER: sup3rab3
      POSTGRES_PASSWORD: Sup3r@dmin_
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sup3rab3 -d purchase_order_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - app_network

  web:
    build: .
    image: sup3rab3/purchase-order-system-web:latest
    command: sh -c "python wait_for_db.py && python manage.py migrate && gunicorn purchase_order.wsgi:application --bind 0.0.0.0:8080 --workers 3"
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_DEBUG=True
      - DB_NAME=purchase_order_db
      - DB_USER=sup3rab3          # Matches the DB service user perfectly
      - DB_PASSWORD=Sup3r@dmin_
      - DB_HOST=db
      - DB_PORT=5432
      - SITE_DOMAIN=${SITE_DOMAIN}
      - ALLOWED_HOSTS=127.0.0.1,localhost,web,192.168.0.129 # Pass as comma-separated string
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge